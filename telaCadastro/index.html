<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="./css/style.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Controlizze | Cadastro</title>
</head>
<body>

  <main class="main-container">
        
        <section class="info-section" aria-labelledby="info-title">

            <header class="logo">
                <img src="./assets/icons/Logotipo.svg" alt="Logotipo do site Controlizze">
            </header>
            
            <h2 id="info-title">Organize seus gastos, planeje seu futuro e construa seus objetivos.</h2>
            <hr class="divider">

            <ul class="benefits-list">
              <li>
                <img src="./assets/icons/papel.svg" alt="" aria-hidden="true" class="benefit-icon">
                <span>Registre sua renda e despesas</span>
              </li>

              <li>
                <img src="./assets/icons/dinheiro.svg" alt="" aria-hidden="true" class="benefit-icon">
                <span>Veja seu saldo em tempo real</span>
              </li>

              <li>
                <img src="./assets/icons/grafico.svg" alt="" aria-hidden="true" class="benefit-icon">
                <span>Divida seus gastos por categorias</span>
              </li>

              <li>
                <img src="./assets/icons/check.svg" alt="" aria-hidden="true" class="benefit-icon">
                <span>Alcance seus objetivos</span>
              </li>
            </ul>

        </section>

        <section class="form-section" aria-labelledby="form-title">
            <article class="card-register">
                
                <header class="form-header">
                    <img src="./assets/icons/cadastro.svg" alt="" aria-hidden="true" class="header-icon">
                    <h3 id="form-title">Crie sua conta!</h3>
                    <p class="subtitle">É rápido e gratuito</p>
                </header>

                <form action="#" method="POST">
                    <fieldset class="form-fields">
                        <legend class="sr-only">Dados de Cadastro</legend>

                        <div class="input-group">
                            <label for="name">Nome Completo</label>
                            <div class="input-wrapper">
                                <img src="./assets/icons/nome.svg" alt="" aria-hidden="true" class="input-icon">
                                <input type="text" id="name" name="name" placeholder="Nome Completo" required autocomplete="name">
                            </div>
                        </div>

                        <div class="input-group">
                            <label for="email">E-mail</label>
                            <div class="input-wrapper">
                                <img src="./assets/icons/mail.svg" alt="" aria-hidden="true" class="input-icon">
                                <input type="email" id="email" name="email" placeholder="E-mail" required autocomplete="email">
                            </div>
                        </div>

                        <div class="input-group">
                            <label for="password">Senha</label>
                            <div class="input-wrapper">
                                <img src="./assets/icons/senha.svg" alt="" aria-hidden="true" class="input-icon">
                                <input type="password" id="password" name="password" placeholder="Senha" required autocomplete="new-password">
                                <button type="button" class="btn-toggle-password" aria-label="Mostrar ou ocultar senha">
                                    <img src="./assets/icons/olho.svg" alt="" aria-hidden="true" class="eye-img">
                                </button>
                            </div>
                        </div>
                    </fieldset>

                    <button type="submit" class="btn-submit">Cadastrar</button>
                </form>

                <footer class="form-footer">
                    <div class="or-divider" role="separator">ou</div>
                    <p class="login-link">Já tem uma conta? <a href="/telaLogin/index.html">Entrar</a></p>
                </footer>

            </article>
        </section>

  </main>

  <script src="./js/script.js"></script>
</body>
</html>
